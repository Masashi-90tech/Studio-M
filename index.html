<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="質問に答えるだけで設計・解析・製作までつながる、DIYのための工房" />
    <title>Studio M Lite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Cpath d='M7 24V9l9 10 9-10v15' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="wordmark">Studio M</span><span class="lite">Lite</span>
          <span class="tagline">DIYのための工房</span>
        </div>
        <input id="projectName" class="project-name" type="text" aria-label="プロジェクト名" maxlength="60" placeholder="プロジェクト名" />
        <div class="actions">
          <button id="btnNew" class="btn" type="button">新規</button>
          <div class="menu-wrap">
            <button id="btnPreset" class="btn" type="button" aria-haspopup="menu" aria-expanded="false">プリセット ▾</button>
            <div id="presetMenu" class="menu" role="menu" hidden></div>
          </div>
          <button id="btnSave" class="btn" type="button">保存</button>
          <button id="btnOpen" class="btn" type="button">開く</button>
          <input id="fileInput" type="file" accept=".json,application/json" hidden />
          <button id="btnExcel" class="btn primary" type="button">Excel出力</button>
          <button id="btnFormula" class="btn" type="button" title="Excel 自身が計算する数式入りのブックを作ります">Excel数式ブック</button>
        </div>
      </header>

      <nav class="tabs" id="tabs" role="tablist" aria-label="解析の種類"></nav>

      <main class="workspace">
        <aside class="rail" id="rail" aria-label="作図ツール"></aside>

        <section class="stage" aria-label="作図と結果">
          <div class="stage-bar" id="stageBar"></div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="view" aria-label="解析結果と形状"></canvas>
          </div>
          <div class="stage-foot"><span id="footCoord" class="coord"></span><span id="footHelp" class="help"></span>
            <div class="draft-bar" id="draftBar" hidden>
              <span>クリックで点を追加</span>
              <button class="btn small primary" type="button" data-act="finish">閉じて確定</button>
              <button class="btn small" type="button" data-act="cancel">取消</button>
            </div>
          </div>
        </section>

        <aside class="side" id="side">
          <div id="results"></div>
          <div id="props"></div>
          <div id="settings"></div>
        </aside>
      </main>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
