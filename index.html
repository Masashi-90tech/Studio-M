<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="質問に答えるだけで設計・解析・製作までつながる、DIYのための工房" />
    <title>Studio M Lite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Cpath d='M7 24V9l9 10 9-10v15' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="wordmark">Studio M</span><span class="lite">Lite</span>
          <span class="tagline">DIYのための工房</span>
        </div>
        <input id="projectName" class="project-name" type="text" aria-label="プロジェクト名" maxlength="60" placeholder="プロジェクト名" />
        <div class="mode-wrap">
          <div class="seg" id="modeSwitch"></div>
          <button id="modeBadge" class="badge-btn" type="button" hidden title="プロ用の詳細設定が使われています。クリックでプロモードに切り替えます">詳細設定を変更済み</button>
        </div>
        <div class="actions">
          <button id="btnNew" class="btn" type="button">新規</button>
          <div class="menu-wrap">
            <button id="btnPreset" class="btn" type="button" aria-haspopup="menu" aria-expanded="false">プリセット ▾</button>
            <div id="presetMenu" class="menu" role="menu" hidden></div>
          </div>
          <div class="menu-wrap">
            <button id="btnFile" class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu">ファイル ▾</button>
            <div id="fileMenu" class="menu menu-narrow" role="menu" aria-label="ファイル" hidden>
              <button id="btnOpen" class="menu-item" type="button" role="menuitem"><strong>開く</strong><span>保存したプロジェクト（.studiom.json）を開きます</span></button>
              <button id="btnKicad" class="menu-item" type="button" role="menuitem"><strong>KiCad基板を開く</strong><span>.kicad_pcb を読み、部品ごとの温度を調べます</span></button>
              <button id="btnMesh" class="menu-item" type="button" role="menuitem"><strong>3Dモデルを開く（STL・OBJ）</strong><span>3D で見ながら断面を切り、流れ・熱・強度・電磁波にかけます</span></button>
              <button id="btnSave" class="menu-item" type="button" role="menuitem"><strong>保存</strong><span>プロジェクトをファイルに書き出します</span></button>
            </div>
          </div>
          <input id="fileInput" type="file" accept=".json,application/json" hidden />
          <button id="btnLearn" class="btn learn-btn" type="button" aria-expanded="false" aria-controls="learnDrawer" title="数学と物理をレッスンで学び直します" hidden>学ぶ</button>
          <button id="btnExcel" class="btn primary" type="button">Excel出力</button>
          <button id="btnFormula" class="btn" type="button" title="Excel 自身が計算する数式入りのブックを作ります">Excel数式ブック</button>
          <div class="menu-wrap">
            <button id="btnPrefs" class="btn icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="prefsPopover" aria-label="設定" title="設定"><span aria-hidden="true">⚙</span></button>
            <div id="prefsPopover" class="menu menu-narrow prefs-pop" role="dialog" aria-label="設定" hidden></div>
          </div>
        </div>
      </header>

      <nav class="tabs" id="tabs" role="tablist" aria-label="解析の種類"></nav>

      <main class="workspace">
        <aside class="rail" id="rail" aria-label="作図ツール"></aside>

        <section class="stage" aria-label="作図と結果">
          <div class="stage-bar" id="stageBar"></div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="view" aria-label="解析結果と形状"></canvas>
          </div>
          <div class="stage-foot"><span id="footCoord" class="coord"></span><span id="footHelp" class="help"></span>
            <div class="draft-bar" id="draftBar" hidden>
              <span>クリックで点を追加</span>
              <button class="btn small primary" type="button" data-act="finish">閉じて確定</button>
              <button class="btn small" type="button" data-act="cancel">取消</button>
            </div>
          </div>
        </section>

        <aside class="side" id="side">
          <div id="verdict" hidden></div>
          <div id="learnChip" hidden></div>
          <div id="mathWindow" hidden></div>
          <div id="results"></div>
          <div id="engine" hidden></div>
          <div id="easy" hidden></div>
          <div id="props"></div>
          <div id="settings"></div>
          <div id="proTools" hidden></div>
        </aside>

        <aside class="learn-drawer" id="learnDrawer" role="complementary" aria-label="学ぶ" hidden></aside>
      </main>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
